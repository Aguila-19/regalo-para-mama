<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Día de las Madres</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Feliz Día de las Madres 💐</h1>

    <p class="frase">
      Mamá, eres el regalo más hermoso que la vida nos pudo dar.
    </p>

    <div class="poema">
      <p>En tus brazos encontramos calma,</p>
      <p>en tu sonrisa nace el amor,</p>
      <p>eres luz que guía nuestra alma,</p>
      <p>y el hogar de nuestro corazón.</p>
    </div>

    <button onclick="mostrarMensaje()">Toca aquí, mamá</button>

    <p id="mensaje"></p>

    <h2>Con mucho amor:</h2>
    <h3>Sus hijos Alejandro y Fabiola ❤️</h3>
  </div>

  <div class="corazones"></div>

  <script src="script.js"></script>
</body>
</html>
